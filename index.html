<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa de Los Ponpones</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--bg:#FBEFD5;--card:#FFF9EA;--ink:#4A2A1A;--mute:#85634E;--red:#C8283C;--pur:#7A3A8C;--teal:#17697A;--yel:#F5B82E;--line:#E6CFA3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241611;--card:#33211A;--ink:#FBEFD5;--mute:#C9A98E;--line:#55392C;--red:#F0566A;--pur:#C79AD9;--teal:#55BFD3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241611;--card:#33211A;--ink:#FBEFD5;--mute:#C9A98E;--line:#55392C;--red:#F0566A;--pur:#C79AD9;--teal:#55BFD3;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.4 Fredoka,"Trebuchet MS",system-ui,sans-serif;min-height:100vh;padding-bottom:110px}
header{text-align:center;padding:18px 16px 6px}
.logo{font-weight:700;font-size:clamp(38px,9vw,64px);line-height:1;margin:0;color:var(--red);text-shadow:2px 2px 0 var(--yel),4px 4px 0 var(--ink);letter-spacing:.5px}
.logo small{display:block;font-size:.42em;color:var(--pur);text-shadow:1px 1px 0 var(--yel);margin-bottom:2px}
nav{display:flex;gap:8px;justify-content:center;margin:14px 0 4px}
nav button{font:inherit;font-weight:600;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 22px;border-radius:99px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg)}
main{max-width:980px;margin:0 auto;padding:12px 16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.prod{font:inherit;text-align:left;color:var(--ink);background:var(--card);border:3px solid var(--c);border-radius:22px;padding:16px 18px;cursor:pointer;box-shadow:0 5px 0 var(--c);display:flex;align-items:center;gap:14px}
.prod:active{transform:translateY(3px);box-shadow:0 2px 0 var(--c)}
.prod .em{font-size:44px}
.prod h2{margin:0;font-size:26px;color:var(--c);font-weight:700}
.prod p{margin:2px 0 0;color:var(--mute);font-size:15px}
button:focus-visible,input:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:5}
.bar b{font-size:22px}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 20px;background:var(--yel);color:#4A2A1A;cursor:pointer;font-size:17px}
.btn.big{width:100%;margin-top:14px;padding:15px}
.btn.alt{background:transparent;border:2px solid var(--line);color:var(--ink)}
.ov{position:fixed;inset:0;background:rgba(40,20,10,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{margin:0 0 10px;font-size:26px}
.l{margin:14px 0 6px;color:var(--mute);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button,.chip{font:inherit;font-weight:600;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px;cursor:pointer}
.seg button b{display:block;font-size:20px}
.seg button.on,.chip.on{border-color:var(--c);background:var(--c);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:99px;padding:8px 14px}
input{font:inherit;width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;margin-top:8px}
.qty{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:16px}
.qty button{font:inherit;font-size:26px;width:48px;height:48px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.qty b{font-size:28px;min-width:36px;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.row small{color:var(--mute);display:block}
.x{font:inherit;border:0;background:none;color:var(--red);font-size:20px;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-size:26px;font-weight:700;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:8px 0 16px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.stat b{font-size:28px;display:block}
.stat span{color:var(--mute)}
.pr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pr label{color:var(--mute);font-size:14px}
.change{font-size:30px;font-weight:700;text-align:center;margin-top:12px;color:var(--teal)}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
:root{--bg:#FDEEDA;--card:#FFF8EE;--tile:#FFE8CC;--acc:#F2C68A;--ink:#2B1B10;--mute:#9C8672;--line:#F1DDC2}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--tile:#432A1E}}
:root[data-theme="dark"]{--tile:#432A1E}
body{font:500 15px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;padding-bottom:170px}
header{display:flex;flex-direction:column;align-items:flex-start;text-align:left;max-width:980px;margin:0 auto;padding:22px 20px 4px}
.wl{color:var(--mute);font-size:13px}
.logo{font-size:30px;font-weight:800;color:var(--ink);text-shadow:none;letter-spacing:-.5px;margin:0}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--acc);padding:6px;border-radius:99px;gap:4px;margin:0;box-shadow:0 8px 24px rgba(120,70,20,.25)}
nav button{border:0;background:transparent;color:#2B1B10;padding:12px 22px;font-weight:700;font-size:15px}
nav button.on{background:#FFF8EE;color:#2B1B10}
.promo{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(120deg,#F6CF98,#E9A95E);border-radius:28px;padding:22px;color:#2B1B10;margin:10px 0 16px;overflow:hidden}
.promo small{font-weight:600;opacity:.75}
.promo h2{margin:4px 0 12px;font-size:26px;line-height:1.1;font-weight:800}
.pill{display:inline-block;background:#FFF8EE;border-radius:99px;padding:9px 18px;font-weight:700;font-size:14px}
.pe{font-size:84px;line-height:1;transform:rotate(-12deg)}
.cats{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.cat{font:inherit;font-weight:600;white-space:nowrap;border:0;background:var(--card);color:var(--ink);padding:11px 20px;border-radius:99px;cursor:pointer;box-shadow:0 2px 8px rgba(120,70,20,.08)}
.cat.on{background:var(--acc);color:#2B1B10}
.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.prod{display:block;position:relative;border:0;box-shadow:none;background:var(--tile);border-radius:28px;padding:10px 10px 14px}
.prod:active{transform:scale(.98);box-shadow:none}
.it{display:flex;align-items:center;justify-content:center;background:var(--card);border-radius:22px;height:130px;margin-bottom:10px}
.prod .em{font-size:64px}
.prod h2{font-size:16px;color:var(--ink);font-weight:700;margin:0 4px}
.prod p{font-size:17px;font-weight:800;color:var(--ink);margin:2px 4px 0}
.add{position:absolute;right:12px;bottom:12px;width:34px;height:34px;border-radius:50%;background:var(--acc);color:#2B1B10;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;line-height:1}
.bar{left:0;right:0;margin:0 auto;width:calc(100% - 32px);max-width:520px;bottom:calc(82px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#2B1B10;border-radius:24px;padding:10px 10px 10px 20px}
.bar .btn{background:#2B1B10;color:#FFF8EE}
.ov{background:rgba(60,35,15,.45)}
.sheet{background:var(--card);border-radius:34px 34px 0 0;animation:none}
.sheet h2{font-size:26px;font-weight:800}
.hero{background:var(--acc);border-radius:26px;height:130px;display:flex;align-items:center;justify-content:center;font-size:76px;margin-bottom:14px}
.seg button,.chip{border:0;background:var(--tile)}
.seg button{border-radius:20px}
.seg button.on,.chip.on{background:var(--acc);color:#2B1B10}
input{background:var(--tile);border:2px solid transparent;border-radius:16px}
.qty button{background:var(--acc);border:0;color:#2B1B10;font-weight:700}
.btn{border-radius:99px;background:var(--acc);color:#2B1B10}
.btn.big{padding:17px}
.btn.alt{background:var(--tile);border:0;color:var(--ink)}
.stat{background:var(--tile);border:0;border-radius:22px}
.row{border-bottom:1px solid var(--line)}
.lnk{display:block;text-align:center;text-decoration:none;margin-top:8px}
.it{background:#FFF3E0;aspect-ratio:1/1;height:auto;overflow:hidden;padding:8px}
.it img{width:100%;height:100%;object-fit:contain;display:block}
.prod{padding:10px 10px 12px}
.prod h2{font-size:13px;font-weight:600;color:var(--mute)}
.add{width:36px;height:36px;background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(120,70,20,.18)}
.pe{width:118px;height:118px;flex:none;border-radius:50%;background:#FFF3E0;transform:none;overflow:hidden;padding:8px}
.pe img{width:100%;height:100%;object-fit:contain;display:block}
.hero{height:210px;background:#FFF3E0;padding:10px;font-size:0}
.hero img{height:100%;max-width:100%;object-fit:contain}
.qty button{display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.qty b{line-height:1}
nav button{padding:11px 14px;font-size:14px}
body{padding-bottom:200px}
.bar{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
textarea{font:inherit;width:100%;border:2px solid transparent;background:var(--tile);color:var(--ink);border-radius:16px;padding:10px 12px;margin-top:8px}
.oc{background:var(--tile);border-radius:24px;padding:14px 16px;margin-bottom:12px}
.oc.first{outline:3px solid var(--acc)}
.oh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.oh span{color:var(--mute);font-size:13px}
.nx{background:var(--acc);color:#2B1B10;border-radius:99px;padding:4px 12px;font-weight:700;font-size:13px;display:inline-block;margin-top:8px}
.ob{margin-top:8px}.ob small{display:block;color:var(--mute)}
.oc ul{margin:10px 0;padding-left:20px}
header{flex-direction:row;align-items:center;gap:12px}
.lg{width:92px;height:92px;object-fit:contain;flex:none}
.logo{font-size:25px;line-height:1.1}
.prod p{padding-right:48px;margin-top:6px}
.prod{padding-bottom:14px}
.add{right:14px;bottom:14px}
</style>
</head>

  txt=o.t==="env"?"Hola "+f+", tu pedido #"+o.no+" de Los Ponpones ya salió y va en camino a tu domicilio. ¡Gracias por tu compra!":"Hola "+f+", tu pedido #"+o.no+" de Los Ponpones ya está listo. Pasa por él cuando gustes, ¡te esperamos!";
  return "https://wa.me/"+(d.length===10?"52":"")+d+"?text="+encodeURIComponent(txt)}
function dn(id){var o=orders.filter(function(x){return x.id===id})[0];if(!o)return;if(sbOn())sbFetch("/rest/v1/orders?id=eq."+id,{method:"PATCH",body:JSON.stringify({estado:"despachado"})},true).then(pull).catch(function(){});o.st="ok";sv("pp_orders",orders);if(o.t!=="suc"&&o.tel)window.open(nw(o),"_blank");draw()}
function dq(id){if(sbOn())sbFetch("/rest/v1/orders?id=eq."+id,{method:"DELETE"},true).catch(function(){});orders=orders.filter(function(x){return x.id!==id});sv("pp_orders",orders);draw()}
function clrO(){if(sbOn())sbFetch("/rest/v1/orders?estado=eq.despachado",{method:"DELETE"},true).catch(function(){});orders=orders.filter(function(x){return x.st!=="ok"});sv("pp_orders",orders);draw()}
function pasteO(){var o=parseO(document.getElementById("pt").value);
  if(!o){document.getElementById("pe").textContent="No pude leer el pedido. Copia el mensaje completo tal como llegó.";return}
  addOrder(o);if(o.n)upC(o.n,o.tel,o.dir,1);draw()}
function ocard(o,first){
  var tm=new Date(o.at).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}),ok=o.st==="ok",can=o.t!=="suc"&&o.tel;
  var act=ok?(can?'<a class="btn big alt lnk" href="'+nw(o)+'" target="_blank" rel="noopener">Volver a avisar por WhatsApp</a>':'')+'<button class="btn big alt" style="margin-top:8px" onclick="dq('+o.id+')">Quitar</button>'
   :'<button class="btn big" onclick="dn('+o.id+')">'+LBL[o.t]+'</button><button class="btn big alt" style="margin-top:8px" onclick="dq('+o.id+')">Quitar pedido</button>';
  return '<div class="oc'+(first?" first":"")+'"><div class="oh"><b>Pedido #'+o.no+'</b><span>'+TYN[o.t]+' · '+tm+'</span></div>'+(first?'<div class="nx">⭐ Este es el siguiente a preparar</div>':'')+
   '<div class="ob"><b>'+esc(o.n||"Sin nombre")+'</b>'+(o.tel?'<small>📞 '+esc(o.tel)+'</small>':'')+(o.dir?'<small>📍 '+esc(o.dir)+'</small>':'')+'</div><ul>'+o.items.map(function(l){return '<li>'+esc(l)+'</li>'}).join("")+'</ul><div class="tot" style="font-size:20px"><span>Total</span><span>'+$(o.total)+'</span></div>'+act+'</div>'}
function drawOrders(m){
  var pen=orders.filter(function(o){return o.st==="pen"}),ok=orders.filter(function(o){return o.st==="ok"});
  var h='<h2 style="margin:14px 0 8px">Por preparar ('+pen.length+')</h2>';
  h+=pen.length?pen.map(function(o,i){return ocard(o,i===0)}).join(""):'<p class="empty">No hay pedidos pendientes.</p>';
  if(ok.length)h+='<h2 style="margin:24px 0 8px">Despachados ('+ok.length+')</h2>'+ok.map(function(o){return ocard(o,false)}).join("")+'<button class="btn alt" onclick="clrO()">Limpiar despachados</button>';
  h+='<h2 style="margin-top:28px">Agregar pedido de WhatsApp</h2><p class="l">Copia el mensaje que te llegó del cliente y pégalo aquí para meterlo a la fila.</p><textarea id="pt" rows="6" placeholder="Pega aquí el pedido"></textarea><div class="change" id="pe" style="color:var(--red);font-size:15px"></div><button class="btn" onclick="pasteO()">Agregar a la fila</button>';
  m.innerHTML=h}
function ac(){var a=document.getElementById("cn"),b=document.getElementById("ct"),n=a.value.trim(),t=b.value.trim(),d=document.getElementById("cd").value.trim(),bad=false;
  a.style.borderColor=b.style.borderColor="transparent";
  if(n.split(/\s+/).length<2){a.style.borderColor="var(--red)";bad=true}
  if(t.replace(/\D/g,"").length<10){b.style.borderColor="var(--red)";bad=true}
  if(bad)return;upC(n,t,d,0);draw()}
function clientsHtml(){
  var h='<h2 style="margin-top:28px">Clientes ('+clients.length+')</h2>';
  h+=clients.length?clients.slice().reverse().map(function(c){
    var w=c.d?'<a class="x" href="https://wa.me/'+(c.d.length===10?"52":"")+c.d+'" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a> ':"";
    return '<div class="row"><span><b>'+esc(c.n)+'</b><small>'+esc([c.tel,c.dir].filter(Boolean).join(" · "))+'</small><small>'+c.k+(c.k===1?" pedido":" pedidos")+'</small></span><span>'+w+'<button class="x" aria-label="Borrar cliente" onclick="dc('+c.id+')">✕</button></span></div>'}).join(""):'<p class="empty">Aún no hay clientes. Se guardan cuando alguien hace un pedido desde este teléfono, o los puedes agregar aquí.</p>';
  h+='<p class="l">Agregar cliente</p><input id="cn" placeholder="Nombre completo"><input id="ct" type="tel" inputmode="tel" placeholder="Teléfono (10 dígitos)"><input id="cd" placeholder="Dirección (opcional)"><button class="btn" style="margin-top:10px" onclick="ac()">Guardar cliente</button>';
  return h}
var CATS=[["all","Todo"],["m","Marquesitas"],["w","Waffles"],["f","Frapes"]];
function sc(i){cat=CATS[i][0];draw()}
var mainKey="";
function mk(){var k=view+"|"+cat;if(mainKey===k)return false;mainKey=k;return true}
var WA="525521532208";
function msg(){return "Pedido Los Ponpones:\n"+cart.map(function(i){return i.q+" x "+name(i)+(det(i)?" ("+det(i)+")":"")+" - $"+(i.u*i.q)}).join("\n")+"\nTotal: $"+tot()}
function wa(){return "https://wa.me/"+WA+"?text="+encodeURIComponent(msg())}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(n){return n.toFixed?"$"+n:n}
function unit(c){return c.p==="f"?PR.f:PR[c.fruit?P[c.p].kf:P[c.p].k]}
function name(it){return P[it.p].n+(it.fruit?(it.fr.every(function(x){return FR.indexOf(x)<3})?" con fruta":" con extras"):"")}
function det(it){return [it.fl,it.fr&&it.fr.join(", ")].filter(Boolean).join(" · ")}
function tab(n){if(n>1&&!admin){openLogin();return}view=n;armed=false;draw()}
function draw(){
  document.getElementById("t1").className=view==1?"on":"";
  document.getElementById("t2").className=view==2?"on":"";
  document.getElementById("t2").textContent=admin?"🧾 Ventas":"🔒 Dueño";
  var t3=document.getElementById("t3"),np=orders.filter(function(o){return o.st==="pen"}).length;t3.hidden=!admin;t3.textContent="📋 Pedidos"+(np?" ("+np+")":"");t3.className=view==3?"on":"";
  if(view>1&&!admin)view=1;
  var m=document.getElementById("main"),b=document.getElementById("bar");
  if(view==1){
    if(mk())m.innerHTML='<div class="promo"><div><small>Hoy en Los Ponpones</small><h2>Marquesitas desde '+$(PR.m)+'</h2><span class="pill">Elige tu favorito</span></div><div class="pe"><img decoding="sync" alt="" src="'+IMG.m+'"></div></div><div class="cats">'+CATS.map(function(c,i){return '<button class="cat'+(cat===c[0]?" on":"")+'" onclick="sc('+i+')">'+c[1]+'</button>'}).join("")+'</div><div class="grid">'+["m","w","f"].filter(function(k){return cat==="all"||cat===k}).map(function(k){var p=P[k];
      var sub=(k==="f"?"":"Desde ")+$(PR[p.k]);
      return '<button class="prod" style="--c:'+p.c+'" onclick="openP(\''+k+'\')"><span class="it"><img decoding="sync" alt="'+p.n+'" src="'+IMG[k]+'"></span><h2>'+p.n+'</h2><p>'+sub+'</p><span class="add">'+CART+'</span></button>'}).join("")+'</div>';
    var t=cart.reduce(function(a,i){return a+i.u*i.q},0),n=cart.reduce(function(a,i){return a+i.q},0);
    b.innerHTML=n?'<div class="bar"><span><b>'+$(t)+'</b> · '+n+(n==1?" producto":" productos")+'</span><button class="btn" onclick="openCart()">Ver pedido</button></div>':"";
  }else{b.innerHTML="";mainKey="";view==3?drawOrders(m):drawSales(m)}
}
function chip(t,on,fn){return '<button class="chip'+(on?" on":"")+'" onclick="'+fn+'">'+esc(t)+'</button>'}
function openP(k){cur={p:k,fruit:false,fl:"",fr:[],oth:"",q:1};rs()}
function rs(){
  var c=cur,p=P[c.p],h='<div class="ov" onclick="if(event.target===this)closeS()"><div class="sheet"><div class="hero"><img decoding="sync" alt="'+p.n+'" src="'+IMG[c.p]+'"></div><h2>'+p.n+'</h2>';
  if(c.p!=="f"){
    h+='<div class="seg"><button class="'+(c.fruit?"":"on")+'" onclick="sf(0)">Normal<b>'+$(PR[p.k])+'</b></button><button class="'+(c.fruit?"on":"")+'" onclick="sf(1)">Con fruta o extra<b>'+$(PR[p.kf])+'</b></button></div>';
    h+='<p class="l">Sabor</p><div class="chips">'+FL.map(function(x,i){return chip(x,c.fl===x&&!c.oth,"sfl("+i+")")}).join("")+'</div><input placeholder="Otro sabor (opcional)" value="'+esc(c.oth)+'" oninput="cur.oth=this.value">';
    if(c.fruit)h+='<p class="l">Frutas y extras</p><div class="chips">'+FR.map(function(x,i){return chip(x,c.fr.indexOf(x)>-1,"tfr("+i+")")}).join("")+'</div>';
  }else h+='<p class="l">Sabor</p><div class="chips">'+FLF.map(function(x,i){return chip(x,c.fl===x&&!c.oth,"sfl("+i+")")}).join("")+'</div><input placeholder="Otro sabor o nota (opcional)" value="'+esc(c.oth)+'" oninput="cur.oth=this.value">';
  h+='<div class="qty"><button aria-label="Menos" onclick="qq(-1)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg></button><b id="qv">'+c.q+'</b><button aria-label="Más" onclick="qq(1)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg></button></div>';
  h+='<button class="btn big" id="ab" onclick="addC()">Agregar '+$(unit(c)*c.q)+'</button><button class="btn big alt" onclick="closeS()" style="margin-top:8px">Cancelar</button></div></div>';
  document.getElementById("ov").innerHTML=h;
}
function sf(v){cur.fruit=!!v;if(!v)cur.fr=[];rs()}
function sfl(i){var L=cur.p==="f"?FLF:FL;cur.fl=cur.fl===L[i]?"":L[i];cur.oth="";rs()}
function tfr(i){var x=FR[i],j=cur.fr.indexOf(x);j>-1?cur.fr.splice(j,1):cur.fr.push(x);rs()}
function qq(d){cur.q=Math.max(1,cur.q+d);document.getElementById("qv").textContent=cur.q;document.getElementById("ab").textContent="Agregar "+$(unit(cur)*cur.q)}
function closeS(){document.getElementById("ov").innerHTML=""}
function addC(){
  var c=cur,it={p:c.p,fruit:c.fruit,fl:(c.oth||"").trim()||c.fl,fr:c.fr.slice(),q:c.q,u:unit(c)};
  var key=JSON.stringify([it.p,it.fruit,it.fl,it.fr,it.u]),f=cart.filter(function(x){return JSON.stringify([x.p,x.fruit,x.fl,x.fr,x.u])===key})[0];
  f?f.q+=it.q:cart.push(it);closeS();draw();
}
function openCart(){
  if(!cart.length){closeS();draw();return}
  var t=cart.reduce(function(a,i){return a+i.u*i.q},0);
  var h='<div class="ov" onclick="if(event.target===this)closeS()"><div class="sheet"><h2>Pedido</h2>'+cart.map(function(it,i){
    return '<div class="row"><span>'+it.q+" × "+name(it)+(det(it)?"<small>"+esc(det(it))+"</small>":"")+'</span><span><b>'+$(it.u*it.q)+'</b> <button class="x" aria-label="Quitar" onclick="rm('+i+')">✕</button></span></div>'}).join("");
  h+='<div class="tot"><span>Total</span><span>'+$(t)+'</span></div>'+(admin?'<button class="btn big" onclick="openPay()">Cobrar</button>':'')+'<button class="btn big" style="margin-top:8px" onclick="openForm()">'+(admin?"Registrar pedido (con datos del cliente)":"Enviar pedido por WhatsApp")+'</button><button class="btn big alt" style="margin-top:8px" onclick="closeS()">Seguir agregando</button></div></div>';
  document.getElementById("ov").innerHTML=h;
}
function rm(i){cart.splice(i,1);openCart();draw()}
var paid=0;
function tot(){return cart.reduce(function(a,i){return a+i.u*i.q},0)}
function openPay(){paid=0;rp()}
function rp(){
  var t=tot(),ch=paid-t;
  var h='<div class="ov"><div class="sheet"><h2>Cobrar</h2><div class="tot"><span>Total</span><span>'+$(t)+'</span></div><p class="l">¿Con cuánto pagan?</p><div class="chips">'+
    '<button class="chip" onclick="sp('+t+')">Exacto</button>'+[50,100,200,500].map(function(v){return '<button class="chip" onclick="sp('+v+')">$'+v+'</button>'}).join("")+'</div>'+
    '<input type="number" inputmode="numeric" placeholder="Otra cantidad" value="'+(paid||"")+'" oninput="paid=+this.value||0;uc()">'+
    '<div class="change" id="chg">'+chg(ch)+'</div>'+
    '<button class="btn big" onclick="done()">Confirmar venta</button><button class="btn big alt" style="margin-top:8px" onclick="openCart()">Volver</button></div></div>';
  document.getElementById("ov").innerHTML=h;
}
function chg(ch){return paid?(ch>=0?"Cambio: "+$(ch):"Faltan "+$(-ch)):""}
function uc(){document.getElementById("chg").textContent=chg(paid-tot())}
function sp(v){paid=v;rp()}
function done(){
  var t=tot();
  if(paid&&paid<t){document.getElementById("chg").textContent="Faltan "+$(t-paid)+" para completar";return}
  sales.push({id:Date.now(),t:Date.now(),items:cart,total:t,paid:paid||t});sv("pp_sales",sales);
  cart=[];closeS();draw();
}
function today(){var d=new Date().toDateString();return sales.filter(function(s){return new Date(s.t).toDateString()===d})}
function drawSales(m){
  var ts=today(),sum=ts.reduce(function(a,s){return a+s.total},0),cnt={m:0,w:0,f:0};
  ts.forEach(function(s){s.items.forEach(function(i){cnt[i.p]+=i.q})});
  var h='<div class="stats"><div class="stat"><b>'+$(sum)+'</b><span>Vendido hoy</span></div><div class="stat"><b>'+ts.length+'</b><span>Ventas</span></div>'+
    ["m","w","f"].map(function(k){return '<div class="stat"><b>'+cnt[k]+'</b><span>'+P[k].n+(cnt[k]==1?"":"s")+'</span></div>'}).join("")+'</div>';
  h+=ts.length?ts.slice().reverse().map(function(s){
    return '<div class="row"><span>'+new Date(s.t).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})+'<small>'+esc(s.items.map(function(i){return i.q+" "+name(i)+(det(i)?" ("+det(i)+")":"")}).join(", "))+'</small></span><span><b>'+$(s.total)+'</b> <button class="x" aria-label="Borrar venta" onclick="ds('+s.id+')">✕</button></span></div>'}).join(""):'<p class="empty">Todavía no hay ventas hoy. Cuando cobres un pedido aparecerá aquí.</p>';
  h+=clientsHtml();
  h+='<h2 style="margin-top:28px">Precios</h2><div class="pr">'+[["m","Marquesita normal"],["mf","Marquesita con fruta"],["w","Waffle normal"],["wf","Waffle con fruta"],["f","Frape"]].map(function(a){
    return '<div><label>'+a[1]+'</label><input type="number" inputmode="decimal" value="'+PR[a[0]]+'" onchange="up(\''+a[0]+'\',this.value)"></div>'}).join("")+'</div>';
  h+='<button class="btn alt" style="margin-top:22px" onclick="clr()">'+(armed?"¿Seguro? Toca otra vez para borrar todo":"Borrar historial de ventas")+'</button>';
  h+='<button class="btn" style="margin:22px 0 0 8px" onclick="logout()">Cerrar sesión</button>';
  m.innerHTML=h;
}
function ds(id){sales=sales.filter(function(s){return s.id!==id});sv("pp_sales",sales);draw()}
function up(k,v){var n=parseFloat(v);if(n>=0){PR[k]=n;sv("pp_prices",PR)}}
function clr(){if(!armed){armed=true;draw();return}sales=[];sv("pp_sales",sales);armed=false;draw()}
draw();
</script>
</body>
</html>
